name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Check changed paths
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: filter
        name: Check changed paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            code=true
          else
            mapfile -d '' changed_paths < <(
              git diff --name-only --no-renames -z "${BASE_SHA}" "${HEAD_SHA}"
            )

            examples_only=true
            themes_changed=false
            themes_only=true

            for path in "${changed_paths[@]}"; do
              if [[ "${path}" != examples/* ]]; then
                examples_only=false
              fi

              if [[ "${path}" = themes/* ]]; then
                themes_changed=true
              else
                themes_only=false
              fi
            done

            if [[ "${themes_changed}" = "true" && "${themes_only}" != "true" ]]; then
              echo "Theme changes must not include files outside themes/." >&2
              exit 1
            fi

            if (( ${#changed_paths[@]} > 0 )) && \
              [[ "${examples_only}" = "true" || "${themes_only}" = "true" ]]; then
              code=false
            else
              code=true
            fi
          fi

          echo "code=${code}" >> "${GITHUB_OUTPUT}"

  quality:
    name: Format, test, and lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # 1.92.0
      - uses: dtolnay/rust-toolchain@87eb139fed4b08a67bd1fa429a21d1f5d523e03e
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo test --workspace --all-features --locked
      - run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings

  build:
    name: Build cac (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            binary: cac
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            binary: cac
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            binary: cac
          - target: aarch64-apple-darwin
            runner: macos-14
            binary: cac
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            binary: cac.exe
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # 1.92.0
      - uses: dtolnay/rust-toolchain@87eb139fed4b08a67bd1fa429a21d1f5d523e03e
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --package cac --target ${{ matrix.target }}
      - name: Smoke test
        shell: bash
        run: target/${{ matrix.target }}/release/${{ matrix.binary }} --version

  complete:
    name: CI complete
    needs:
      - changes
      - quality
      - build
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check required jobs
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          DETECTION_RESULT: ${{ needs.changes.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        shell: bash
        run: |
          test "${DETECTION_RESULT}" = "success"

          if [[ "${CODE_CHANGED}" = "true" ]]; then
            test "${QUALITY_RESULT}" = "success"
            test "${BUILD_RESULT}" = "success"
          else
            test "${CODE_CHANGED}" = "false"
          fi
