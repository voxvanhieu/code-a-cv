name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Theme contribution check
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: filter
        name: Theme contribution check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            code=true
          else
            mapfile -d '' changed_paths < <(
              git diff --name-only --no-renames -z "${BASE_SHA}" "${HEAD_SHA}"
            )

            code=false
            themes_changed=false
            themes_only=true

            for path in "${changed_paths[@]}"; do
              if [[ "${path}" = themes/* ]]; then
                themes_changed=true
              else
                themes_only=false
              fi

              case "${path}" in
                Cargo.lock | Cargo.toml | dist-workspace.toml | \
                  crates/* | themes/* | docs/examples/customized-layout/* | scripts/* | .cargo/* | .github/workflows/* | rust-toolchain*)
                  code=true
                  ;;
              esac
            done

            if [[ "${themes_changed}" = "true" && "${themes_only}" != "true" ]]; then
              echo "Theme changes must not include files outside themes/." >&2
              exit 1
            fi
            if [[ "${themes_changed}" = "true" ]]; then
              echo "Theme-only contribution accepted. Theme validation runs in workspace tests."
            else
              echo "No theme contribution in this PR."
            fi
          fi

          echo "code=${code}" >> "${GITHUB_OUTPUT}"

  quality:
    name: Format, test, and lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # 1.92.0
      - uses: dtolnay/rust-toolchain@87eb139fed4b08a67bd1fa429a21d1f5d523e03e
        with:
          components: clippy, rustfmt
      # v2.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        if: github.event_name == 'pull_request'
        with:
          key: quality
      - run: cargo fmt --all --check
      - run: bash scripts/tests/test_release_resolution.sh
      - run: cargo test --workspace --all-features --locked
      - run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings

  build:
    name: Build cac (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            binary: cac
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            binary: cac
          - target: aarch64-apple-darwin
            runner: macos-14
            binary: cac
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            binary: cac
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            binary: cac.exe
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # 1.92.0
      - uses: dtolnay/rust-toolchain@87eb139fed4b08a67bd1fa429a21d1f5d523e03e
        with:
          targets: ${{ matrix.target }}
      # v2.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        if: github.event_name == 'pull_request'
        with:
          key: build-${{ matrix.target }}
      - run: cargo build --release --locked --package cac --target ${{ matrix.target }}
      - name: Smoke test
        shell: bash
        run: target/${{ matrix.target }}/release/${{ matrix.binary }} --version
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install cargo-dist (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh
      - name: Install cargo-dist (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: irm https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.ps1 | iex
      - run: dist generate --check
      - run: dist build --artifacts=global
      - name: Test generated npm launcher
        shell: bash
        run: |
          npm ci --prefix target/distrib/cac-npm-package --omit=dev --ignore-scripts
          node scripts/test-npm-package.cjs target/distrib/cac-npm-package target/${{ matrix.target }}/release/${{ matrix.binary }}

  complete:
    name: CI complete
    needs:
      - changes
      - quality
      - build
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check required jobs
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          DETECTION_RESULT: ${{ needs.changes.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        shell: bash
        run: |
          test "${DETECTION_RESULT}" = "success"

          if [[ "${CODE_CHANGED}" = "true" ]]; then
            test "${QUALITY_RESULT}" = "success"
            test "${BUILD_RESULT}" = "success"
          else
            test "${CODE_CHANGED}" = "false"
          fi
