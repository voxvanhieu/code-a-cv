[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "npm"]
npm-scope = "@voxvanhieu"
npm-package = "code-a-cv"
# Publish the generated archive separately with npm trusted publishing.
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Sign release artifacts with GitHub's build provenance attestations
github-attestations = true
# Whether to install an updater program
install-updater = false

[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1"
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333"
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9"
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6"
